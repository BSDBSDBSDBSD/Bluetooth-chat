name: Build NearChat APK

on:
  push:
    branches: ["main", "master", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        id: build
        continue-on-error: true
        env:
          NEARCHAT_KEYSTORE_PASSWORD: ${{ secrets.NEARCHAT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$NEARCHAT_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret NEARCHAT_KEYSTORE_PASSWORD is missing - APK is signed with a temporary key and will not update over older installs"
          fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NearChat-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as GitHub release "latest"
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NearChat.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest NearChat.apk --title "NearChat – build ${{ github.run_number }}" \
            --notes "APK לבדיקה. חתימה קבועה: ${{ secrets.NEARCHAT_KEYSTORE_PASSWORD != '' && 'כן – מתעדכן מעל הגרסה הקודמת' || 'לא – חסר הסוד NEARCHAT_KEYSTORE_PASSWORD' }}. commit ${{ github.sha }}" --target ${{ github.sha }}

      - name: Save build log and APK to branch build-output
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > /tmp/out/result.txt
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > /tmp/out/errors.txt 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/NearChat.apk 2>/dev/null || true
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
